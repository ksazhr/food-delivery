<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Menu</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<!-- 🔐 PROTEKSI ADMIN -->
<script src="../js/admin-guard.js"></script>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>🍔 Admin</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="menu.html" class="active">Menu</a>
    <a href="orders.html">Orders</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </aside>

  <!-- CONTENT -->
  <main class="content">
    <h1>Kelola Menu</h1>

    <!-- ===== FORM TAMBAH MENU ===== -->
    <div class="add-menu">
      <h3>Tambah Menu</h3>

    <input type="text" id="nama" placeholder="Nama Menu" />
    <input type="text" id="kategori" placeholder="Kategori (makanan/minuman)" />
    <input type="number" id="harga" placeholder="Harga" />
    <input type="number" id="stok" placeholder="Stok" />

      <button onclick="addMenu()">Tambah</button>
    </div>

    <!-- ===== TABLE MENU ===== -->
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Harga</th>
          <th>Stok</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="menuList">
        <tr>
          <td colspan="4">Memuat menu...</td>
        </tr>
      </tbody>
    </table>
  </main>

</div>

<script src="../js/admin-menu.js"></script>

<script>
  function logout() {
    localStorage.clear();
    window.location.href = "../auth.html";
  }
</script>

</body>
</html>

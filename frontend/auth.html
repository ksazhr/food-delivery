<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Authentication</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
  <h1>🍔 Food Delivery</h1>

  
  <div class="auth-card" id="loginCard">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="loginResult" class="result-text"></p>
  </div>


  <div class="auth-card" id="registerCard">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" id="regNama" placeholder="Nama Lengkap" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>
    <p id="registerResult" class="result-text"></p>
  </div>
</div>

<script src="js/auth-page.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
